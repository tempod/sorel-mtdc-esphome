# =============================================================================
#  Test di collegamento ESP <-> MCP2515, SENZA la centralina.
#  Il modulo in modalita' LOOPBACK riceve i frame che trasmette lui stesso.
#  Se nel log ogni 5 s compare "ricevuto ... DE AD BE EF", SPI e alimentazione
#  sono a posto e si puo' passare alla configurazione principale.
#  (Non verifica il quarzo: controllare a vista se e' 8.000 o 16.000 MHz.)
# =============================================================================
esphome:
  name: sorelmtdc-test

esp8266:
  board: nodemcuv2        # Wemos D1 mini: d1_mini

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key_sorelmtdc

spi:
  clk_pin: D5
  mosi_pin: D7
  miso_pin: D6

canbus:
  - platform: mcp2515
    id: test_can
    cs_pin: D8
    clock: 8MHZ
    bit_rate: 250KBPS
    mode: LOOPBACK
    can_id: 0x1FFFFF00
    use_extended_id: true
    on_frame:
      - can_id: 0
        can_id_mask: 0
        use_extended_id: true
        then:
          - lambda: |-
              std::string hex; char b[4];
              for (auto v : x) { snprintf(b, sizeof(b), "%02X ", v); hex += b; }
              ESP_LOGI("test", "ricevuto ID 0x%08X  [%s]", (unsigned) can_id, hex.c_str());

interval:
  - interval: 5s
    then:
      - canbus.send:
          canbus_id: test_can
          can_id: 0x1FFFFF00
          use_extended_id: true
          data: [0xDE, 0xAD, 0xBE, 0xEF]
